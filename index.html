<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NETRA-ROVER MONITORING SYSTEM</title>
    <link rel="stylesheet" type="text/css" href="/style.css">
    <script src="/script.js"></script>
</head>
<body>
    <header class="topbar">
        <!-- THIS BLOCK IS FOR LOGO  -->
        <div class="brand">
            <div class="brand-logo"> N</div>
            <div>
                <h1>NETRA</h1>
                <p>Robot Mission control</p>
            </div>
        </div>
        <!-- THIS BLOCK IS FOR NAVIGATION -->
        <nav>
            <a href="#Dashboard">Dashboard</a>
             <a href="#Fleet">Fleet</a>
              <a href="#Telemetry">Telemetry</a>
               <a href="Alerts">Alerts</a>
             
        </nav>
        <!-- this block shows the system online,timing -->
        <div class="header-right">
            <span class="online-dot"></span>
            <span>SYSYEM ONLINE</span>
        <strong id="clock">--:--:--</strong>
        </div>
          <!-- this is for dispatch mission button -->
        <button id="dispatch-open" type="button">+Dispatch button</button>

    </header>

    <main class="page">
        <section class="kpi-grid">
            <article class="kpi-card">
                <span>Rovers online</span>
                <h1 id="online-count">6/6<h1>
                    <p>ACTIVE ROVER UNITS</p>
            </article>

            <article class="kpi-card">
                <span>AVERAGE BATTERY</span>
                <h1 id="average battery">52%<h1>
                    <p>fleet battery level</p>
            </article>

            <article class="kpi-card">
                <span>OPEN ALERTS</span>
                <h1 id="alert-count">1<h1>
                    <p>requires attention</p>
            </article>

            <article class="kpi-card">
                <span>DISTANCE TODAY</span>
                <h1 id="distance">14.3km<h1>
                    <p>Total simulated distance</p>
            </article>
        </section>

    </main>
    
</body>
</html>
